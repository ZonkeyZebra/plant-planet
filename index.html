<style>

:root{--ink:#000;--paper:#fff}

/* ---------- line drawings (black on white, generic) ---------- */
var VE=' vector-effect="non-scaling-stroke"';
function el(tag,attrs,cls){return '<'+tag+' class="'+(cls||'s')+'" '+attrs+'/>';}
function pth(d,c){return el('path','d="'+d+'"',c);}
function cir(x,y,r,c){return el('circle','cx="'+x+'" cy="'+y+'" r="'+r+'"',c);}

function lin(x1,y1,x2,y2,c){return pth('M'+x1+' '+y1+'L'+x2+' '+y2,c||'n');}
function gtr(t,inner){return '<g transform="'+t+'">'+inner+'</g>';}
var GROUND=lin(8,108,112,108);
function wave(y){return pth('M4 '+y+'q7.5 -4 15 0t15 0t15 0t15 0t15 0t15 0t15 0','n');}
var LP={
 lance:'M0 0C6 -6 6 -14 0 -22C-6 -14 -6 -6 0 0Z',
 round:'M0 0C10 -2 10 -16 0 -18C-10 -16 -10 -2 0 0Z',
 lobed:'M0 0L5 -3L4 -6L9 -8L6 -12L9 -16L3 -17L0 -22L-3 -17L-9 -16L-6 -12L-9 -8L-4 -6L-5 -3Z',
 heart:'M0 -3C-4 2 -11 -2 -9 -10C-8 -15 -3 -19 0 -24C3 -19 8 -15 9 -10C11 -2 4 2 0 -3Z',
 narrow:'M0 0C2 -8 1 -18 0 -30C-1 -18 -2 -8 0 0Z'
};
function leaf(type,x,y,ang,sc){
  var inner='';
  if(LP[type])inner='<path class="s" d="'+LP[type]+'"'+VE+'/>';
  else if(type==='needle')inner='<path class="n" d="M0 0L0 -20M0 0L-6 -18M0 0L6 -18M0 0L-11 -14M0 0L11 -14"'+VE+'/>';
  else if(type==='scale')inner='<path class="n" d="M0 0L0 -18M0 -4L-3 -7M0 -4L3 -7M0 -9L-3 -12M0 -9L3 -12M0 -14L-3 -17M0 -14L3 -17"'+VE+'/>';
  else if(type==='compound'){
    inner='<path class="n" d="M0 0L0 -26"'+VE+'/>';
    [8,15,22].forEach(function(y2){
      inner+='<g transform="translate(0 -'+y2+') rotate(-55) scale(.45)"><path class="s" d="'+LP.lance+'"'+VE+'/></g>';
      inner+='<g transform="translate(0 -'+y2+') rotate(55) scale(.45)"><path class="s" d="'+LP.lance+'"'+VE+'/></g>';
    });
    inner+='<g transform="translate(0 -26) scale(.45)"><path class="s" d="'+LP.lance+'"'+VE+'/></g>';

  return '<g transform="translate('+x+' '+y+') rotate('+ang+') scale('+sc+')">'+inner+'</g>';

function ring(cx,cy,n,rx,ry,d,c){var s='';for(var i=0;i<n;i++){s+='<ellipse class="'+(c||'s')+'" cx="'+cx+'" cy="'+(cy-d)+'" rx="'+rx+'" ry="'+ry+'" transform="rotate('+(i*360/n)+' '+cx+' '+cy+')"/>';}return s;}
function cloud(cs){
  return cs.map(function(c){return cir(c[0],c[1],c[2]);}).join('')+cs.map(function(c){return '<circle class="f" cx="'+c[0]+'" cy="'+c[1]+'" r="'+(c[2]-1)+'"/>';}).join('');
}
var SPOTS=[[48,44,0],[68,40,30],[60,58,-20],[40,64,-40],[78,62,40],[56,30,10],[70,54,-30],[50,54,25]];
function leafSpots(type,oy,sc,n){var s='';for(var i=0;i<Math.min(n||SPOTS.length,SPOTS.length);i++){var p=SPOTS[i];s+=leaf(type,p[0],p[1]+oy,p[2],sc);}return s;}

function aFlower(p){
  var h=p.h||60,top=108-h,cx=60,cy=top,s=GROUND,i,a,n,sh,r,x,y,k,sz,ux,uy,by;
  s+=pth('M60 108Q'+(60+(p.bend||4))+' '+(108-h/2)+' 60 '+top,'n');

      for(i=-3;i<=3;i++){ux=cx+i*10;uy=cy+4+Math.abs(i)*3;s+=lin(cx,cy+14,ux,uy)+cir(ux,uy,5);}
      s+=cir(cx,cy+2,5);break;
    case 'brush':
      for(i=0;i<5;i++){by=cy+i*7;s+=ell(cx-5,by,3.5,8,-30)+ell(cx+5,by,3.5,8,30);}break;

      s+=cir(cx,cy-2,2.5,'k');break;
  }

}
function aTree(p){

}
var FL=[[44,76],[58,66],[74,74],[50,88],[68,88],[82,86],[36,86]];
function aBush(p){

    [[44,34],[54,26],[64,30],[74,38],[84,46]].forEach(function(w,i2){
      var bx=48+i2*6;

function hay(b){return [b.name,b.latin,b.types.map(function(t){return TL[t];}).join(' '),b.colors.join(' '),b.leaf,b.regions.join(' '),b.seasons.join(' '),KW[b.id]||''].join(' ').toLowerCase();}
function doSearch(q){

  var res=PLANTS.concat(TOOLS).filter(function(b){var h=hay(b);return toks.every(function(t){return h.indexOf(t)>=0;});});
  var ql=q.toLowerCase();
  return res.sort(function(a,b){var an=a.name.toLowerCase().indexOf(ql)>=0?0:1,bn=b.name.toLowerCase().indexOf(ql)>=0?0:1;return an-bn||a.name.localeCompare(b.name);});
}

/* ---------- routing ---------- */
function crumbsFor(route){
  var i=route.indexOf(':');var k=i<0?route:route.slice(0,i);var arg=i<0?'':route.slice(i+1);
  var H=['home','Home'],PL=['places','Places and seasons'];
  if(k==='home')return [H];
  if(k==='type')return [H,[route,TL[arg]]];
  if(k==='places')return [H,PL];
  if(k==='place')return [H,PL,[route,arg]];
  if(k==='season'){var p=arg.split('|');return [H,PL,['place:'+p[0],p[0]],[route,p[1]]];}
  if(k==='search')return [H,[route,'Search: '+arg]];
  if(k==='leaf')return crumbsFor(S.leafFrom).concat([[route,BYID[arg].name]]);
  if(k==='log')return [H,[route,'Click log']];
  if(k==='test')return [H,[route,'Test mode']];
  if(k==='results')return [H,[route,'Test results']];
  if(k==='report')return [H,[route,'Struggle report']];
  return [H];
}
function go(route){
  var isLeaf=route.indexOf('leaf:')===0;
  if(T&&T.state==='running'){
    if(isLeaf){completeTask(route.slice(5),false);return;}
    var cur=T.views[T.views.length-1];
    if(route!==cur.route){
      cur.dwell=performance.now()-cur.enter;
      T.views.push({route:route,page:pageLabel(route),enter:performance.now(),clicks:0,dwell:0});
    }
  }else if(isLeaf&&S.route.indexOf('leaf:')!==0){S.leafFrom=S.route;}
  S.route=route;S.confirm='';render();window.scrollTo(0,0);
}

/* ---------- struggle analysis ---------- */
var PAGE_ORDER=['Home page','Flowers page','Trees page','Bushes page','Aquatics page','Places index','Place page','Season list','Search results'];
function routeParts(r){var i=r.indexOf(':');return [i<0?r:r.slice(0,i),i<0?'':r.slice(i+1)];}
function depthOf(r){var k=routeParts(r)[0];return k==='home'?0:k==='place'?2:k==='season'?3:1;}
function pageLabel(r){
  var p=routeParts(r),k=p[0];
  if(k==='home')return 'Home page';
  if(k==='type')return TL[p[1]]+' page';
  if(k==='places')return 'Places index';
  if(k==='place')return 'Place page';
  if(k==='season')return 'Season list';
  if(k==='search')return 'Search results';
  return k;
}
function onPath(r,task){
  var p=routeParts(r),k=p[0],a=p[1];
  var targets=task.ok.map(function(id){return BYID[id];});
  if(k==='type')return targets.some(function(b){return b.types.indexOf(a)>=0;});
  if(k==='places')return targets.some(function(b){return !b.tool;});
  if(k==='place')return targets.some(function(b){return b.regions.indexOf(a)>=0;});
  if(k==='season'){var q=a.split('|');return targets.some(function(b){return b.regions.indexOf(q[0])>=0&&b.seasons.indexOf(q[1])>=0;});}
  return true;
}
/* Backtrack: leaving a page without going deeper (up, sideways, or back to a page already seen).
   Wrong turn: going deeper into a section that does not hold the answer. */
function analyze(task,views,skipped,correct){
  var ev=[],bt=0,wt=0,i;
  for(i=0;i<views.length-1;i++){
    var a=views[i],b=views[i+1],da=depthOf(a.route),db=depthOf(b.route);
    var seen=views.slice(0,i+1).some(function(v){return v.route===b.route;});
    if(db<da){ev.push({type:'backtrack up',from:a.page,to:b.page});bt++;}
    else if(db===da){ev.push({type:'backtrack sideways',from:a.page,to:b.page});bt++;}
    else if(seen){ev.push({type:'revisit',from:a.page,to:b.page});bt++;}
    else if(!onPath(b.route,task)){ev.push({type:'wrong turn',from:a.page,to:b.page});wt++;}
  }
  var last=views[views.length-1];
  if(skipped)ev.push({type:'gave up',from:last.page,to:''});
  else if(!correct)ev.push({type:'wrong answer',from:last.page,to:''});
  return {events:ev,bt:bt,wt:wt};
}
function blankPage(name){return {page:name,visits:0,seconds:0,avg_seconds:0,clicks:0,backtracks:0,wrong_turns:0,wrong_answers:0,gave_up:0,struggle:0};}
function computeReport(sessions){
  var pages={},pairs={},tasks={},n=0,firstTotal=0,wrongFirst=0,firstWrong={};
  PAGE_ORDER.forEach(function(p){pages[p]=blankPage(p);});
  function pg(name){return pages[name]||(pages[name]=blankPage(name));}
  sessions.forEach(function(s){s.tasks.forEach(function(t){
    if(!t.views)return;
    n++;
    var tk=tasks[t.task_id]||(tasks[t.task_id]={task_id:t.task_id,attempts:0,correct:0,ms:0,bt:0,wt:0,ev:{}});
    tk.attempts++;if(t.correct)tk.correct++;tk.ms+=t.time_ms;tk.bt+=t.backtracks;tk.wt+=t.wrong_turns;
    t.views.forEach(function(v){var p=pg(v.page);p.visits++;p.seconds+=v.ms/1000;p.clicks+=v.clicks;});
    t.events.forEach(function(e){
      var p=pg(e.from);
      if(e.type==='wrong turn')p.wrong_turns++;
      else if(e.type==='wrong answer')p.wrong_answers++;
      else if(e.type==='gave up')p.gave_up++;
      else{p.backtracks++;var key=e.from+' -> '+e.to;pairs[key]=(pairs[key]||0)+1;}
      tk.ev[e.from]=(tk.ev[e.from]||0)+1;
    });
    if(t.first_choice){firstTotal++;if(t.first_choice_on_path===false){wrongFirst++;firstWrong[t.first_choice]=(firstWrong[t.first_choice]||0)+1;}}
  });});
  var rows=Object.keys(pages).map(function(k){var p=pages[k];p.struggle=p.backtracks+p.wrong_turns+p.wrong_answers+p.gave_up;p.avg_seconds=p.visits?p.seconds/p.visits:0;return p;});
  var total=rows.reduce(function(a,p){return a+p.struggle;},0);
  var pairList=Object.keys(pairs).map(function(k){return {path:k,count:pairs[k]};}).sort(function(a,b){return b.count-a.count;}).slice(0,10);
  var taskList=Object.keys(tasks).map(function(k){
    var t=tasks[k],top='',m=0;for(var pgn in t.ev){if(t.ev[pgn]>m){m=t.ev[pgn];top=pgn;}}
    return {task_id:t.task_id,attempts:t.attempts,correct_pct:Math.round(100*t.correct/t.attempts),avg_seconds:Math.round(t.ms/t.attempts/100)/10,avg_backtracks:Math.round(10*t.bt/t.attempts)/10,avg_wrong_turns:Math.round(10*t.wt/t.attempts)/10,top_struggle_page:top||'none'};
  }).sort(function(a,b){return parseInt(a.task_id.slice(1),10)-parseInt(b.task_id.slice(1),10);});
  var summary=[];
  if(!n){summary.push('No test data with page tracking yet. Run test mode, then come back.');}
  else{
    var ranked=rows.slice().sort(function(a,b){return b.struggle-a.struggle;});
    if(ranked[0].struggle>0)summary.push('Most struggle: '+ranked[0].page+' ('+ranked[0].struggle+' of '+total+' struggle events, '+Math.round(100*ranked[0].struggle/total)+'%).');
    else summary.push('No struggle events recorded in '+n+' task attempts.');
    var slow=rows.filter(function(p){return p.visits>0;}).sort(function(a,b){return b.avg_seconds-a.avg_seconds;})[0];
    if(slow)summary.push('Longest average time per visit: '+slow.page+' ('+(Math.round(slow.avg_seconds*10)/10)+' seconds).');
    if(pairList.length)summary.push('Most common backtrack: '+pairList[0].path.replace(' -> ',' back to ')+' ('+pairList[0].count+(pairList[0].count===1?' time).':' times).'));
    if(firstTotal){
      var fw=Object.keys(firstWrong).sort(function(a,b){return firstWrong[b]-firstWrong[a];})[0];
      summary.push('First click from Home went to a section without the answer in '+wrongFirst+' of '+firstTotal+' attempts'+(fw?', most often '+fw+'.':'.'));
    }
  }
  return {n:n,pages:rows,tasks:taskList,pairs:pairList,summary:summary,total:total};
}

/* ---------- test mode ---------- */
function persistSession(){
  var rec={id:T.id,participant:T.pid,started:T.startedAt,complete:T.i>=T.order.length,tasks:T.tasks.slice()};
  var idx=-1;RESULTS.forEach(function(s,i){if(s.id===T.id)idx=i;});
  if(idx<0)RESULTS.push(rec);else RESULTS[idx]=rec;
  save('upresults',RESULTS);
}
function completeTask(id,skipped){
  var task=T.order[T.i];
  var ms=Math.round(performance.now()-T.taskStart);
  clearInterval(T.timer);
  var lastView=T.views[T.views.length-1];lastView.dwell=performance.now()-lastView.enter;
  var correct=skipped?false:task.ok.indexOf(id)>=0;
  var an=analyze(task,T.views,!!skipped,correct);
  var second=T.views[1];
  T.tasks.push({order:T.i+1,task_id:task.id,scenario:task.text,expected:task.ok.join('|'),endpoint:skipped?'':id,endpoint_name:skipped?'':BYID[id].name,correct:correct,skipped:!!skipped,time_ms:ms,clicks:T.clicks,
    backtracks:an.bt,wrong_turns:an.wt,searches:T.searches,filters_used:T.filters,
    first_choice:second?second.page:'',first_choice_on_path:second?onPath(second.route,task):'',
    page_trail:T.views.map(function(v){return v.page+' ('+(v.dwell/1000).toFixed(1)+'s, '+v.clicks+' clicks)';}).join(' > '),
    struggle_events:an.events.map(function(e){return e.type+' at '+e.from+(e.to?' to '+e.to:'');}).join('; '),
    path:T.path.join(' > '),
    views:T.views.map(function(v){return {page:v.page,route:v.route,ms:Math.round(v.dwell),clicks:v.clicks};}),
    events:an.events});
  T.i++;
  persistSession();
  T.state=T.i>=T.order.length?'done':'scenario';
  S.route='home';S.query='';render();window.scrollTo(0,0);
}
function startTest(){
  var el=$('#pid');var pid=(el&&el.value.trim())||('anon-'+Math.random().toString(36).slice(2,6));
  T={id:'s'+Date.now(),pid:pid,order:shuffle(TASKS),i:0,state:'scenario',startedAt:new Date().toISOString(),tasks:[],clicks:0,path:[],taskStart:0,timer:null};
  render();window.scrollTo(0,0);
}
function beginTask(){
  T.state='running';T.taskStart=performance.now();T.clicks=0;T.path=[];T.filters=0;T.searches=0;
  T.views=[{route:'home',page:'Home page',enter:performance.now(),clicks:0,dwell:0}];
  S.route='home';S.query='';
  render();window.scrollTo(0,0);
  clearInterval(T.timer);
  T.timer=setInterval(function(){var el=$('#timer');if(el)el.textContent=fmt(performance.now()-T.taskStart);},250);
}

function anyFilter(){var f=S.filters;return !!(f.type.length||f.color.length||f.leaf.length||f.region.length||f.season.length);}
function matches(p,type,useTypeFilter){
  var f=S.filters;
  if(type&&p.types.indexOf(type)<0)return false;
  if(useTypeFilter&&f.type.length&&!p.types.some(function(t){return f.type.indexOf(t)>=0;}))return false;
  if(f.color.length&&!p.colors.some(function(c){return f.color.indexOf(c)>=0;}))return false;
  if(f.leaf.length&&f.leaf.indexOf(p.leaf)<0)return false;
  if(f.region.length&&!p.regions.some(function(r){return f.region.indexOf(r)>=0;}))return false;
  if(f.season.length&&!p.seasons.some(function(s){return f.season.indexOf(s)>=0;}))return false;
  return true;
}
function fgroup(key,title,opts){
  return '<fieldset class="fs"><legend>'+esc(title)+'</legend>'+opts.map(function(o){
    var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;
    return '<label class="chk"><input type="checkbox" data-fgroup="'+key+'" data-fval="'+esc(v)+'" data-log="filter:'+esc(title)+' = '+esc(l)+'"'+(S.filters[key].indexOf(v)>=0?' checked':'')+'> <span>'+esc(l)+'</span></label>';
  }).join('')+'</fieldset>';
}
var FTITLE={type:'Plant type',color:'Color (flower or fall leaf)',leaf:'Leaf shape',region:'Location',season:'Season seen'};

  var R=computeReport(RESULTS);
  var rows=R.pages.slice().sort(function(a,b){return b.struggle-a.struggle||b.avg_seconds-a.avg_seconds;});
  var max=Math.max.apply(null,rows.map(function(r){return r.struggle;}).concat([1]));
  function th(a){return '<tr>'+a.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>';}
  var pageTable='<div class="scroll"><table><thead>'+th(['Rank','Page','Visits','Avg seconds per visit','Clicks','Backtracks from here','Wrong turns made here','Wrong answers','Gave up','Struggle events'])+'</thead><tbody>'+rows.map(function(r,i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(r.page)+'</td><td>'+r.visits+'</td><td>'+(Math.round(r.avg_seconds*10)/10)+'</td><td>'+r.clicks+'</td><td>'+r.backtracks+'</td><td>'+r.wrong_turns+'</td><td>'+r.wrong_answers+'</td><td>'+r.gave_up+'</td><td>'+r.struggle+'<span class="meter" style="width:'+Math.round(100*r.struggle/max)+'%"></span></td></tr>';
  }).join('')+'</tbody></table></div>';
  var taskTable='<div class="scroll"><table><thead>'+th(['Task','Attempts','Correct %','Avg seconds','Avg backtracks','Avg wrong turns','Page with most struggle'])+'</thead><tbody>'+(R.tasks.length?R.tasks.map(function(t){
    return '<tr><td>'+esc(t.task_id)+'</td><td>'+t.attempts+'</td><td>'+t.correct_pct+'</td><td>'+t.avg_seconds+'</td><td>'+t.avg_backtracks+'</td><td>'+t.avg_wrong_turns+'</td><td>'+esc(t.top_struggle_page)+'</td></tr>';
  }).join(''):'<tr><td colspan="7">No data yet.</td></tr>')+'</tbody></table></div>';
  var pairTable='<div class="scroll"><table><thead>'+th(['Backtrack (from page back to page)','Times'])+'</thead><tbody>'+(R.pairs.length?R.pairs.map(function(p){return '<tr><td>'+esc(p.path.replace(' -> ',' back to '))+'</td><td>'+p.count+'</td></tr>';}).join(''):'<tr><td colspan="2">No backtracks recorded.</td></tr>')+'</tbody></table></div>';
  return screen('Struggle report')+crumbs('report')+
  '<section class="col"><h2>Where people struggle: '+R.n+' task attempts from '+RESULTS.length+' sessions</h2>'+
  R.summary.map(function(s){return '<p class="box">'+esc(s)+'</p>';}).join('')+
  '<h2>By page, most struggle first</h2>'+pageTable+
  '<h2>By task</h2>'+taskTable+
  '<h2>Most common backtracks</h2>'+pairTable+
  '<p class="ph">Backtrack: leaving a page without going deeper into the site. That means going up, switching sideways to another section, or returning to a page already seen. Wrong turn: going deeper into a section that does not hold the answer. Wrong answer and gave up are counted on the page where the task ended. Struggle events add these four counts. Each is counted against the page the person was on when it happened.</p></section>'+
  exportBox('report','Export struggle report');
}

function render(){
  var a=$('#app');var html;
  if(T&&T.state==='scenario'){html='<div class="col">'+scenarioScreen()+'</div>';}
  else if(T&&T.state==='done'){html='<div class="col">'+doneScreen()+'</div>';}
  else{
    var r=S.route,i=r.indexOf(':'),k=i<0?r:r.slice(0,i),arg=i<0?'':r.slice(i+1),body;
    if(k==='home')body=home();
    else if(k==='type')body=typePage(arg);
    else if(k==='places')body=placesIndex();
    else if(k==='place')body=placePage(arg);
    else if(k==='season')body=seasonPage(arg);
    else if(k==='search')body=searchPage(arg);
    else if(k==='leaf')body=leafPage(arg);
    else if(k==='log')body=logPage();
    else if(k==='test')body=testIntro();
    else if(k==='results')body=resultsPage();
    else if(k==='report')body=reportPage();
    else body=home();
    html='<div class="col">'+((T&&T.state==='running')?testBar():'')+header()+body+footer()+'</div>';
  }
  a.innerHTML=html;
}

/* ---------- events ---------- */
function act(name,el){
  if(name==='clearfilters'){S.filters={type:[],color:[],leaf:[],region:[],season:[]};render();return;}
  if(name==='unfilter'){var g=el.getAttribute('data-fgroup'),v=el.getAttribute('data-fval');S.filters[g]=S.filters[g].filter(function(x){return x!==v;});render();return;}
  if(name==='copy'){copyText(getData(el.getAttribute('data-src'),el.getAttribute('data-fmt')),$('#out'));return;}
  if(name==='show'){var ta=$('#out');ta.value=getData(el.getAttribute('data-src'),el.getAttribute('data-fmt'));ta.focus();ta.select();setStatus('Text shown below and selected.');return;}
  if(name==='clear'){
    var key=el.getAttribute('data-key');
    if(S.confirm!==key){S.confirm=key;render();return;}
    if(key==='log'){LOG=[];save('uplog',LOG);}else{RESULTS=[];save('upresults',RESULTS);}
    S.confirm='';render();return;
  }
  if(name==='starttest'){startTest();return;}
  if(name==='begin'){beginTask();return;}
  if(name==='skip'){completeTask('',true);return;}
  if(name==='quit'){clearInterval(T.timer);T=null;S.route='home';render();window.scrollTo(0,0);return;}
  if(name==='finishtest'){T=null;S.route=el.getAttribute('data-go')||'home';render();window.scrollTo(0,0);return;}
}
var app=$('#app');
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-go],[data-act]');if(!el)return;
  if(el.getAttribute('data-act')){act(el.getAttribute('data-act'),el);return;}
  go(el.getAttribute('data-go'));
});
app.addEventListener('submit',function(e){
  e.preventDefault();
  if(!SHOW_SEARCH)return;
  var inp=$('#q');var q=inp?inp.value.trim():'';
  if(!q)return;
  logEvent('search',q);
  go('search:'+q);
});
app.addEventListener('change',function(e){
  var el=e.target;var g=el.getAttribute&&el.getAttribute('data-fgroup');if(!g||el.type!=='checkbox')return;
  var v=el.getAttribute('data-fval');var arr=S.filters[g];
  if(el.checked&&arr.indexOf(v)<0)arr.push(v);
  if(!el.checked)S.filters[g]=arr.filter(function(x){return x!==v;});
  render();
  var again=document.querySelector('input[data-fgroup="'+g+'"][data-fval="'+v.replace(/"/g,'\\"')+'"]');
  if(again)again.focus();
});
render();
})();
</script>
